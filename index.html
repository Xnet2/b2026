<script>
(function (l) {
    if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&'); }).join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
    }
}(window.location));
</script>

<style>

[hidden] { display: none !important; }

mark { background: #fff0b3; color: inherit; border-radius: 3px; padding: 0 1px; }

<script>
'use strict';

/* ============ הגדרות ============ */
const CFG = {
    API_URL: "https://dhoc97909.pythonanywhere.com/elections-api/posts",
    USERS_API_URL: "https://dhoc97909.pythonanywhere.com/elections-api/users",
    SYNC_URL: "https://dhoc97909.pythonanywhere.com/elections-api/sync",
    FEED_URL: "https://dhoc97909.pythonanywhere.com/elections-api/feed",
    ADMIN_EMAIL: "dh058328@gmail.com",
    GOOGLE_CLIENT_ID: "426523025549-7c50rkn7cun4vmm2r802u0ij6egjehtg.apps.googleusercontent.com",
    CAT: 'cat_',
    CACHE_KEY: 'elections_forum_data_cache_v1',
    USER_KEY: 'elections_forum_user',
    DRAFT_KEY: 'elections_forum_topic_draft',
    CLOUDINARY_URL: 'https://api.cloudinary.com/v1_1/dpsgd6esr/image/upload',
    CLOUDINARY_PRESET: 'foromny'
};

const state = { posts: [], user: null, loading: true, loadError: false, lastLoad: 0, renderToken: 0, drafts: {}, quote: null, editing: null, editDraft: '', topicId: null, shownKey: '', pendingScroll: null, form: null, submitting: false, uploads: 0, uploadTarget: null, inflight: 0, mutatedAt: 0, usersUI: { q: '', sort: 'count' }, profileMax: 60, profileUid: '', follows: { topics: new Set(), users: new Set() }, notifs: [], notifTimer: null, needsReg: false, returnTo: null, locallyRead: new Set(), locallySeen: new Set(), mention: null, rev: -1, feed: [], pstiaMax: 40, pstiaDraft: '' };

/* ============ כלי עזר ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseInt(v, 10); return isNaN(n) ? 0 : n; };
const wait = ms => new Promise(r => setTimeout(r, ms));
const safeJSON = (s, fallback = null) => { try { return JSON.parse(s); } catch (e) { return fallback; } };

function toast(msg, type = '') {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    $('#toasts').appendChild(el);
    setTimeout(() => el.remove(), 3200);
}

const PALETTE = ['#0f6e7c', '#e0674f', '#1c8c63', '#c8404f', '#c99318', '#1b93a3', '#a8508a', '#6d63c9', '#2563eb', '#c2410c', '#0d9488'];
function avatar(name, pic, size = 38) {
    const s = `width:${size}px;height:${size}px;font-size:${Math.round(size * .4)}px`;
    if (pic && /^https?:\/\//i.test(pic)) {
        return `<img class="avatar" style="${s}" src="${esc(pic)}" alt="" referrerpolicy="no-referrer" loading="lazy">`;
    }
    const n = String(name || '?').trim();
    let h = 0; for (const ch of n) h = (h * 31 + ch.codePointAt(0)) >>> 0;
    return `<span class="avatar" style="${s};background:${PALETTE[h % PALETTE.length]}">${esc(n.charAt(0) || '?')}</span>`;
}

/* ============ שכבת נתונים ============ */
async function request(url, opts = {}, timeout = 20000) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeout);
    try { return await fetch(url, { ...opts, signal: ctrl.signal }); }
    finally { clearTimeout(t); }
}

// שליחת פעולה לשרת עם ניסיונות חוזרים. check מאשר שהתשובה באמת מציינת הצלחה
async function apiPostRaw(body, check = () => true, { retries = 2, delay = 800 } = {}, url = CFG.API_URL) {
    for (let i = 0; i <= retries; i++) {
        try {
            const res = await request(url, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(body)
            });
            if (res.ok) {
                const json = await res.json().catch(() => null);
                if (check(json)) return true;
            }
        } catch (e) { /* ננסה שוב */ }
        if (i < retries) await wait(delay);
    }
    return false;
}
// עוטף כל כתיבה לשרת, כדי שרענון ברקע לא ידרוס שינוי שעדיין בדרך
async function apiPost(body, check, opts, url) {
    state.inflight++; state.mutatedAt = Date.now();
    try { return await apiPostRaw(body, check, opts, url); }
    finally { state.inflight--; state.mutatedAt = Date.now(); }
}
const api = {
    insert: rows => apiPost({ action: 'insert', data: rows }, j => !(j && j.error), { retries: 0 }),
    update: (column, value, data) => apiPost({ action: 'update', column, value, data }, j => j && j.updated > 0, { retries: 3 }),
    remove: (column, value) => apiPost({ action: 'delete', column, value }, j => j && j.deleted > 0)
};
const feedApi = {
    insert: rows => apiPost({ action: 'insert', data: rows }, j => !(j && j.error), { retries: 0 }, CFG.FEED_URL),
    update: (value, data) => apiPost({ action: 'update', value, data }, j => j && j.updated > 0, { retries: 3 }, CFG.FEED_URL),
    remove: value => apiPost({ action: 'delete', value }, j => j && j.deleted > 0, undefined, CFG.FEED_URL)
};

// מחבר נתוני שרת עם פוסטים שעדיין ממתינים (עדכון אופטימי), ומשמר ציטוטים שחסרים בתשובה
function mergeServer(serverPosts) {
    const ids = new Set(serverPosts.map(p => p.id));
    const local = new Map(state.posts.map(p => [p.id, p]));
    serverPosts.forEach(sp => {
        const lp = local.get(sp.id);
        if (lp && lp.quote_content && !sp.quote_content) {
            sp.quote_id = lp.quote_id; sp.quote_author = lp.quote_author; sp.quote_content = lp.quote_content;
        }
    });
    return serverPosts.concat(state.posts.filter(p => p._status === 'pending' && !ids.has(p.id)));
}

function saveCache() {
    try {
        const clean = state.posts.filter(p => p._status !== 'pending').map(p => { const c = { ...p }; delete c._status; return c; });
        localStorage.setItem(CFG.CACHE_KEY, JSON.stringify(clean));
    } catch (e) {}
}

async function loadData() {
    const started = Date.now(), isRefresh = state.posts.length > 0;
    const cached = isRefresh ? null : safeJSON(localStorage.getItem(CFG.CACHE_KEY), null);
    if (Array.isArray(cached) && cached.length) {
        state.posts = cached;
        state.loading = false;
        render({ soft: true });
    }
    try {
        const res = await request(CFG.SYNC_URL + '?since=-1');
        const json = await res.json();
        if (!json || !Array.isArray(json.posts)) throw new Error('bad response');
        if (isRefresh && (state.inflight > 0 || state.mutatedAt > started)) return;   // יש שינוי בדרך, נרענן בפעם הבאה
        state.posts = mergeServer(json.posts);
        state.feed = mergeFeed(json.feed || []);
        state.rev = json.rev;
        state.loadError = false;
        saveCache();
    } catch (e) {
        state.loadError = !state.posts.length;
    }
    state.loading = false;
    state.lastLoad = Date.now();
    render({ soft: true });
    paintFeed();
    startSync();
}

function mergeFeed(serverFeed) {
    const ids = new Set(serverFeed.map(p => p.id));
    return serverFeed.concat(state.feed.filter(p => p._status === 'pending' && !ids.has(p.id)));
}

/* ============ סנכרון חי: רק שינויים, בלי רינדור מחדש של מה שלא השתנה ============ */
let syncTimer = null, syncBusy = false, syncFails = 0;
function upsert(arr, rows) {
    const idx = new Map(arr.map((p, i) => [p.id, i]));
    rows.forEach(r => { if (idx.has(r.id)) arr[idx.get(r.id)] = r; else { idx.set(r.id, arr.length); arr.push(r); } });
}
function applySync(j) {
    const known = new Set(state.posts.map(p => p.id));
    if (j.reset) { state.posts = mergeServer(j.posts); state.feed = mergeFeed(j.feed || []); }
    else {
        if (j.posts.length) upsert(state.posts, j.posts);
        if (j.removed.length) { const rm = new Set(j.removed); state.posts = state.posts.filter(p => !rm.has(p.id)); }
        if (j.feed.length) upsert(state.feed, j.feed);
        if (j.feed_removed.length) { const rm = new Set(j.feed_removed); state.feed = state.feed.filter(p => !rm.has(p.id)); }
    }
    state.rev = j.rev;
    const rt = parseRoute().type;
    if (!j.reset && (rt === 'topic' || rt === 'post') && state.topicId) {
        const me = state.user && state.user.email;
        j.posts.forEach(p => { if (!known.has(p.id) && p.topic_id === state.topicId && !p.title && !emailEq(p.author_email, me)) toast((p.author_name || 'משתמש') + ' הגיב/ה בנושא'); });
    }
    if (j.reset || j.posts.length || j.removed.length) { saveCache(); render({ soft: true }); }
    if (j.reset || j.feed.length || j.feed_removed.length) paintFeed();
}
async function syncOnce() {
    if (syncBusy || state.loading || state.rev < 0 || document.hidden || state.inflight > 0 || state.submitting) return;
    syncBusy = true;
    const started = Date.now();
    try {
        const res = await request(CFG.SYNC_URL + '?since=' + state.rev, {}, 12000);
        const j = await res.json();
        if (!j || !Array.isArray(j.posts)) throw new Error('bad response');
        syncFails = 0;
        if (state.inflight > 0 || state.mutatedAt > started) return;   // יש כתיבה בדרך, נקבל את השינוי בסבב הבא
        applySync(j);
    } catch (e) { syncFails++; }
    finally { syncBusy = false; }
}
function startSync() {
    if (syncTimer) return;
    const loop = async () => { await syncOnce(); syncTimer = setTimeout(loop, Math.min(15000, 2500 + syncFails * 2500)); };
    syncTimer = setTimeout(loop, 2500);
}

/* ---------- עדכון DOM מדויק: מחליפים רק מה שהשתנה ---------- */
function setHTML(el, html) {
    if (!el || el._h === html) return false;
    el._h = html; el.innerHTML = html;
    return true;
}

    const tpl = document.createElement('template');
    const make = it => { tpl.innerHTML = it.html; const n = tpl.content.firstElementChild; nodeHTML.set(n, it.html); return n; };
    let i = 0;
    for (const it of items) {
        const cur = container.children[i];
        if (cur && cur.id === it.id) { if (nodeHTML.get(cur) !== it.html) cur.replaceWith(make(it)); }
        else container.insertBefore(make(it), cur || null);

}

const ROUTE_TYPES = ['topic', 'post', 'category', 'user', 'tag', 'tags', 'users', 'latest', 'popular', 'login', 'new', 'edit'];
const BASE = (() => {
    const parts = location.pathname.split('/').filter(Boolean);
    if (parts.length && /\.html?$/i.test(parts[parts.length - 1])) parts.pop();
    let i = parts.findIndex(p => ROUTE_TYPES.includes(p));
    if (i === -1) i = parts.length;
    const base = parts.slice(0, i);
    return base.length ? '/' + base.join('/') : '';
})();
const hrefOf = path => BASE + path;

function parseRoute() {
    let path = location.pathname;
    path = path.indexOf(BASE) === 0 ? path.slice(BASE.length) : path;
    path = path.replace(/^\/+|\/+$/g, '').replace(/^index\.html$/i, '');
    if (!path && location.hash.length > 1) {            // תמיכה בקישורי hash ישנים
        const [t, id] = location.hash.slice(1).split('/');
        if (ROUTE_TYPES.includes(t) && id) { path = t + '/' + id; history.replaceState(null, '', hrefOf('/' + path)); }
    }
    const [type, raw] = path.split('/');
    let id = raw ? decodeURIComponent(raw) : '';
    if (type === 'topic' && /^\d+$/.test(id)) id = topicIdFromNumber(id) || id;
    if (type === 'category' && /^\d+$/.test(id)) id = categoryIdFromNumber(id) || id;
    if (type === 'post' && /^\d+$/.test(id)) id = postIdFromNumber(id) || id;
    if (type === 'new' && /^\d+$/.test(id)) id = categoryIdFromNumber(id) || id;
    if (type === 'edit' && /^\d+$/.test(id)) id = topicIdFromNumber(id) || id;
    return { type: ROUTE_TYPES.includes(type) ? type : 'home', id };
}
function go(path) {
    if (hrefOf(path) !== location.pathname) history.pushState(null, '', hrefOf(path));
    render({ nav: true });
}
window.addEventListener('popstate', () => render({ nav: true }));

function parseStoredDate(str) {
    const m = String(str || '').match(/(\d{1,2})\.(\d{1,2})\.(\d{4}),?\s*(\d{1,2}):(\d{2}):(\d{2})/);
    if (!m) return null;
    const [, d, mo, y, h, mi, s] = m.map(Number);
    return new Date(y, mo - 1, d, h, mi, s);
}
function timeAgo(str) {
    const d = parseStoredDate(str) || (isNaN(Date.parse(str)) ? null : new Date(str));
    if (!d || isNaN(d.getTime())) return String(str || '');
    const sec = Math.floor((Date.now() - d.getTime()) / 1000);
    if (sec < 60) return 'לפני פחות מדקה';
    const min = Math.floor(sec / 60);
    if (min < 60) return min === 1 ? 'לפני דקה' : `לפני ${min} דקות`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return hr === 1 ? 'לפני שעה' : `לפני ${hr} שעות`;
    const day = Math.floor(hr / 24);
    if (day < 30) return day === 1 ? 'לפני יום' : `לפני ${day} ימים`;
    const mon = Math.floor(day / 30);
    if (mon < 12) return mon === 1 ? 'לפני חודש' : `לפני ${mon} חודשים`;
    const yr = Math.floor(mon / 12);
    return yr === 1 ? 'לפני שנה' : `לפני ${yr} שנים`;
}

// עיצוב טקסט: הטקסט עובר escape מלא לפני כל החלפה, ולכן אי אפשר להחדיר HTML
function inlineMd(s) {
    s = s.replace(/@\[([^\]]+)\]\(([^()\s]+)\)/g, (m, n, u) => `<a class="mention" href="${hrefOf('/user/' + u)}" data-link="/user/${u}">@${n}</a>`);
    s = s.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g, '<img class="post-img" src="$2" alt="$1" loading="lazy">');
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
    return s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
}
function renderContent(str) {
    const out = [];
    let list = null;
    const flush = () => { if (list) { out.push({ b: true, h: '<ul>' + list.map(i => `<li>${i}</li>`).join('') + '</ul>' }); list = null; } };
    esc(String(str || '').replace(/\r/g, '')).split('\n').forEach(line => {
        let m;
        if ((m = line.match(/^- (.*)$/))) { (list = list || []).push(inlineMd(m[1])); return; }
        flush();
        if ((m = line.match(/^(#{1,3}) (.*)$/))) { const l = m[1].length + 1; out.push({ b: true, h: `<h${l}>${inlineMd(m[2])}</h${l}>` }); return; }
        if ((m = line.match(/^&gt; ?(.*)$/))) { out.push({ b: true, h: `<blockquote>${inlineMd(m[1])}</blockquote>` }); return; }
        out.push({ b: false, h: inlineMd(line) });
    });
    flush();
    return out.map((x, i) => (i > 0 && !x.b && !out[i - 1].b ? '<br>' : '') + x.h).join('');
}
const stripMd = (s, n = 200) => {
    const t = String(s || '').replace(/!\[[^\]]*\]\([^)]+\)/g, '').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/[*_~`#>]/g, '').replace(/\s+/g, ' ').trim();
    return t.length > n ? t.slice(0, n) + '…' : t;
};
const emailEq = (a, b) => String(a || '').toLowerCase() === String(b || '').toLowerCase();
const canManage = p => !!state.user && !!p && (state.user.isAdmin || emailEq(state.user.email, p.author_email));

}

function confirmDialog(title, text, okLabel = 'אישור', danger = true) {

        ov.innerHTML = `<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t"><h3 id="dlg-t">${esc(title)}</h3><p>${esc(text)}</p>
            <div class="dialog-actions"><button type="button" class="btn btn-ghost btn-sm" data-r="0">ביטול</button><button type="button" class="btn ${danger ? 'btn-danger' : 'btn-primary'} btn-sm" data-r="1">${esc(okLabel)}</button></div></div>`;
        const done = v => { document.removeEventListener('keydown', onKey, true); ov.remove(); if (prev && prev.focus) prev.focus(); resolve(v); };
        const onKey = e => { if (e.key === 'Escape') { e.preventDefault(); done(false); } };
        ov.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) done(b.dataset.r === '1'); else if (e.target === ov) done(false); });
        document.addEventListener('keydown', onKey, true);

        ov.querySelector('[data-r="0"]').focus();
    });
}

    const post = state.posts.find(p => p.id === id);
    if (!post) return;
    const cur = votes.get(id), prev = { likes: num(post.likes), dislikes: num(post.dislikes) };
    let likes = prev.likes, dislikes = prev.dislikes;
    if (cur === type) { if (type === 'like') likes--; else dislikes--; }
    else { if (cur === 'like') likes--; if (cur === 'dislike') dislikes--; if (type === 'like') likes++; else dislikes++; }
    post.likes = Math.max(0, likes); post.dislikes = Math.max(0, dislikes);
    votes.set(id, cur === type ? null : type);
    paintPosts();
    // תור לכל הודעה: שמירות מהירות ברצף נשלחות לפי הסדר ולא דורסות זו את זו
    voteQueue[id] = (voteQueue[id] || Promise.resolve()).then(async () => {
        const ok = await api.update('id', id, { likes: post.likes, dislikes: post.dislikes });
        if (!ok) { post.likes = prev.likes; post.dislikes = prev.dislikes; votes.set(id, cur); paintPosts(); toast('שמירת ההצבעה נכשלה', 'error'); }
    });
}

function startQuote(id) {
    const post = state.posts.find(p => p.id === id);
    if (!post) return;
    const sel = window.getSelection(), el = document.getElementById('body-' + id);
    let text = '';
    if (sel && !sel.isCollapsed && el && el.contains(sel.anchorNode) && el.contains(sel.focusNode)) text = sel.toString();
    state.quote = { id, author: post.author_name || '', snippet: stripMd(text || post.content, 220) };
    paintComposer();
    const ta = $('#reply-input');
    if (ta) { ta.scrollIntoView({ behavior: 'smooth', block: 'center' }); ta.focus({ preventScroll: true }); }
}

async function sendReply() {
    if (!state.user) { toast('יש להתחבר כדי להגיב', 'error'); return; }
    const { main } = threadData(state.topicId);
    if (!canReply(main)) { toast('אין לך הרשאה להגיב בנושא זה', 'error'); return; }
    const ta = $('#reply-input');
    const content = ta ? ta.value.trim() : '';
    if (!content) return;
    const q = state.quote, topicId = state.topicId;
    const post = {
        id: 'post_' + Date.now(), topic_id: topicId, title: '', category: '',
        author_name: state.user.name, author_email: state.user.email, author_avatar: state.user.picture,
        content, created_at: new Date().toLocaleString('he-IL'), likes: 0, dislikes: 0,
        quote_id: q ? q.id : '', quote_author: q ? q.author : '', quote_content: q ? q.snippet : '', _status: 'pending'
    };
    state.posts.push(post);
    state.drafts[topicId] = ''; state.quote = null;
    paintComposer(); paintPosts(); paintHead();
    scrollToPost(post.id);
    const ok = await api.insert([post]);
    if (ok) {
        post._status = null;
        saveCache();
        if (state.topicId === topicId) paintPosts();
        afterReply(post, main);
    } else {
        state.posts = state.posts.filter(x => x !== post);
        state.drafts[topicId] = content; state.quote = q;
        if (state.topicId === topicId) { paintComposer(); paintPosts(); paintHead(); }
        toast('השליחה נכשלה, התגובה נשמרה בתיבה. נסו שוב', 'error');
    }
}

async function saveEdit(id) {
    const post = state.posts.find(p => p.id === id);
    const content = ($('#edit-field') || {}).value ? $('#edit-field').value.trim() : state.editDraft.trim();
    if (!post || !content) return;
    const prev = post.content;
    post.content = content; state.editing = null; paintPosts();
    const ok = await api.update('id', id, { content });
    if (ok) { toast('ההודעה עודכנה', 'success'); saveCache(); }
    else { post.content = prev; paintPosts(); toast('העדכון נכשל, נסו שוב', 'error'); }
}

async function deletePost(id) {
    const post = state.posts.find(p => p.id === id);
    if (!post) return;
    const isMain = !!post.title;
    const yes = await confirmDialog(isMain ? 'מחיקת נושא' : 'מחיקת הודעה', isMain ? 'הנושא יוסתר מהפורום. אפשר יהיה לשחזר אותו.' : 'ההודעה תוסתר. אפשר יהיה לשחזר אותה.', 'מחיקה');
    if (!yes) return;
    const prev = post.deleted;
    post.deleted = 'X';
    paintPosts(); paintHead();
    if (isMain && !state.user.isAdmin) go('/');
    const ok = await api.update('id', id, { deleted: 'X' });
    if (ok) { toast(isMain ? 'הנושא נמחק' : 'ההודעה נמחקה', 'success'); saveCache(); }
    else { post.deleted = prev; if ($('#thread-posts')) { paintPosts(); paintHead(); } toast('המחיקה נכשלה, נסו שוב', 'error'); }
}

async function restorePost(id) {
    const post = state.posts.find(p => p.id === id);
    if (!post || !canManage(post)) return;
    post.deleted = ''; paintPosts(); paintHead();
    const ok = await api.update('id', id, { deleted: '' });
    if (ok) { toast('ההודעה שוחזרה', 'success'); saveCache(); }
    else { post.deleted = 'X'; paintPosts(); paintHead(); toast('השחזור נכשל, נסו שוב', 'error'); }
}

/* ============ עורך, העלאת תמונות וטופס נושא ============ */
let uploadSeq = 0;
function editorHTML(id, value, placeholder, withPreview = false) {
    const btn = (k, icon, title) => `<button type="button" class="tb" data-act="fmt" data-fmt="${k}" data-target="${id}" title="${title}" aria-label="${title}"><i class="fa-solid ${icon}"></i></button>`;
    return `<div class="editor">
        <div class="toolbar">${btn('bold', 'fa-bold', 'מודגש')}${btn('italic', 'fa-italic', 'נטוי')}${btn('strike', 'fa-strikethrough', 'קו חוצה')}${btn('h', 'fa-heading', 'כותרת')}${btn('ul', 'fa-list-ul', 'רשימה')}${btn('quote', 'fa-quote-right', 'ציטוט')}${btn('code', 'fa-code', 'קוד')}${btn('link', 'fa-link', 'קישור')}${btn('image', 'fa-image', 'הוספת תמונה')}
            ${withPreview ? '<span class="grow"></span><div class="seg" role="tablist"><button type="button" role="tab" aria-selected="true" data-act="tab" data-tab="write">כתיבה</button><button type="button" role="tab" aria-selected="false" data-act="tab" data-tab="preview">תצוגה מקדימה</button></div>' : ''}</div>
        <textarea id="${id}" class="field" data-editor-field placeholder="${esc(placeholder)}" aria-label="${esc(placeholder || 'תוכן')}">\n${esc(value)}</textarea>
        ${withPreview ? '<div class="preview post-body" hidden></div>' : ''}</div>`;
}

function fmt(id, kind) {
    if (kind === 'image') { state.uploadTarget = id; $('#img-input').click(); return; }
    const ta = document.getElementById(id);
    if (!ta) return;
    ta.focus();
    const v = ta.value, s = ta.selectionStart, e = ta.selectionEnd, sel = v.slice(s, e);
    const wrap = (l, r, ph) => { const txt = sel || ph; ta.setRangeText(l + txt + r, s, e, 'end'); ta.setSelectionRange(s + l.length, s + l.length + txt.length); };
    const prefix = pre => {
        const ls = s === 0 ? 0 : v.lastIndexOf('\n', s - 1) + 1;
        ta.setRangeText(v.slice(ls, e).split('\n').map(l => pre + l).join('\n'), ls, e, 'end');
    };
    switch (kind) {
        case 'bold': wrap('**', '**', 'טקסט מודגש'); break;
        case 'italic': wrap('*', '*', 'טקסט נטוי'); break;
        case 'strike': wrap('~~', '~~', 'טקסט'); break;
        case 'code': wrap('`', '`', 'קוד'); break;
        case 'h': prefix('## '); break;
        case 'ul': prefix('- '); break;
        case 'quote': prefix('> '); break;
        case 'link': { const txt = sel || 'טקסט הקישור'; ta.setRangeText(`[${txt}](https://)`, s, e, 'end'); const us = s + txt.length + 3; ta.setSelectionRange(us, us + 8); break; }
    }
    ta.dispatchEvent(new Event('input', { bubbles: true }));
}

async function uploadImage(file, id) {
    const ta = document.getElementById(id);
    if (!ta) return;
    if (!file.type.startsWith('image/')) { toast('ניתן להעלות קבצי תמונה בלבד', 'error'); return; }
    if (file.size > 8 * 1024 * 1024) { toast('התמונה גדולה מדי (מקסימום 8MB)', 'error'); return; }
    // סימון זמני במקום התמונה, שמוחלף בכתובת האמיתית בסיום ההעלאה
    const token = `![מעלה תמונה ${++uploadSeq}...]()`;
    const at = ta.selectionStart;
    ta.setRangeText((at > 0 && ta.value[at - 1] !== '\n' ? '\n' : '') + token + '\n', at, ta.selectionEnd, 'end');
    ta.dispatchEvent(new Event('input', { bubbles: true }));
    state.uploads++;
    toast('מעלה תמונה...');
    let md = '';
    try {
        const fd = new FormData();
        fd.append('file', file);
        fd.append('upload_preset', CFG.CLOUDINARY_PRESET);
        const res = await request(CFG.CLOUDINARY_URL, { method: 'POST', body: fd }, 90000);
        const data = await res.json();
        if (!res.ok || !data.secure_url) throw new Error('upload');
        md = `![תמונה](${data.secure_url})`;
        toast('התמונה הועלתה', 'success');
    } catch (e) { toast('שגיאה בהעלאת התמונה', 'error'); }
    state.uploads--;
    const live = document.getElementById(id);   // ייתכן שהעורך נבנה מחדש בינתיים
    if (live) {
        const i = live.value.indexOf(token);
        if (i >= 0) { live.setRangeText(md, i, i + token.length, 'preserve'); live.dispatchEvent(new Event('input', { bubbles: true })); }
    }
}

const parseTags = s => String(s || '').split(/[,،]/).map(x => x.trim()).filter(Boolean);
const notice = (title, text = '') => `<div class="card empty"><i class="fa-regular fa-circle-question"></i><b>${esc(title)}</b>${esc(text)}<br><a class="btn btn-primary" style="margin-top:16px" href="${hrefOf('/')}" data-link="/">חזרה לדף הבית</a></div>`;

let draftTimer;
function queueDraft() {
    const f = state.form;
    if (!f || f.mode !== 'new') return;
    clearTimeout(draftTimer);
    draftTimer = setTimeout(() => {
        try {
            if (!f.title && !f.content && !f.tags.length) localStorage.removeItem(CFG.DRAFT_KEY);
            else localStorage.setItem(CFG.DRAFT_KEY, JSON.stringify({ title: f.title, category: f.category, tags: f.tags, content: f.content }));
        } catch (e) {}
    }, 400);
}
function formDirty() {
    const f = state.form;
    if (!f || f.mode !== 'edit') return false;
    return f.title !== f.orig.title || f.content !== f.orig.content || f.category !== f.orig.category || f.tags.join(',') !== f.orig.tags;
}

function paintTags() {
    const el = $('#tag-chips'), f = state.form;
    if (el && f) el.innerHTML = f.tags.map((g, i) => `<span class="tchip">${esc(g)}<button type="button" data-act="tag-del" data-i="${i}" aria-label="הסרת התגית ${esc(g)}"><i class="fa-solid fa-xmark"></i></button></span>`).join('');
}
function addTags(raw) {
    const f = state.form;
    if (!f) return;
    parseTags(raw).forEach(g => {
        g = g.slice(0, 24);
        if (f.tags.length < 8 && !f.tags.some(x => x.toLowerCase() === g.toLowerCase())) f.tags.push(g);
    });
    paintTags(); queueDraft();
}
function paintPick() {
    const el = $('#cat-pick'), f = state.form;
    if (el && f) el.innerHTML = getCategories().map(c => `<button type="button" class="pick" role="radio" aria-checked="${c.topic_id === f.category}" data-act="pick-cat" data-id="${esc(c.topic_id)}">${esc(c.title)}</button>`).join('');
}

function formView({ type, id }) {
    const edit = type === 'edit';
    if (!state.user) {
        return `<div class="card login-card"><h2>${edit ? 'עריכת נושא' : 'פתיחת נושא חדש'}</h2><p>${edit ? 'כדי לערוך נושא' : 'כדי לפתוח נושא'} צריך להתחבר ולהשלים הרשמה קצרה.</p>${loginLink()}</div>`;
    }
    const cats = getCategories();
    if (!cats.length) return notice('אין עדיין קטגוריות', 'אפשר לפתוח נושא רק אחרי שנוצרה קטגוריה אחת לפחות.');
    let main = null;
    if (edit) {
        main = threadData(id).main;
        if (!main || !canManage(main) || (isDeleted(main) && !state.user.isAdmin)) return notice('אי אפשר לערוך את הנושא הזה', 'הנושא לא נמצא או שאין לך הרשאה לערוך אותו.');
        const tags = parseTags(main.tags);
        state.form = { mode: 'edit', topicId: id, mainId: main.id, title: main.title || '', category: main.category, tags, content: main.content || '',
            orig: { title: main.title || '', content: main.content || '', category: main.category, tags: tags.join(',') } };
    } else {
        const d = safeJSON(localStorage.getItem(CFG.DRAFT_KEY), null) || {};
        const valid = c => cats.some(x => x.topic_id === c);
        state.form = { mode: 'new', title: d.title || '', category: valid(id) ? id : (valid(d.category) ? d.category : cats[0].topic_id),
            tags: Array.isArray(d.tags) ? d.tags.slice(0, 8) : [], content: d.content || '' };
    }
    const f = state.form;
    setTimeout(() => { paintTags(); paintPick(); const el = $('#form-title'); if (el && !edit) el.focus({ preventScroll: true }); }, 0);
    return `<nav class="crumbs" aria-label="מיקום"><a href="${hrefOf('/')}" data-link="/">דף הבית</a><i class="fa-solid fa-chevron-left"></i><span>${edit ? 'עריכת נושא' : 'נושא חדש'}</span></nav>
        <h1 class="page-title" style="margin-bottom:18px">${edit ? 'עריכת נושא' : 'פתיחת נושא חדש'}</h1>
        <div class="card form-card" id="topic-form">
            <label class="flabel" for="form-title">כותרת</label>
            <input id="form-title" class="input" maxlength="150" placeholder="כותרת קצרה וברורה" value="${esc(f.title)}">
            <span class="flabel">קטגוריה</span>
            <div class="cat-pick" id="cat-pick" role="radiogroup" aria-label="קטגוריה"></div>
            <label class="flabel" for="tag-input">תגיות<span class="fhint">לא חובה, עד 8. מקישים Enter או פסיק אחרי כל תגית</span></label>
            <div class="tags-input" id="tags-box"><span id="tag-chips" style="display:contents"></span><input id="tag-input" placeholder="הוספת תגית" maxlength="24"></div>
            <span class="flabel">תוכן</span>
            ${editorHTML('form-content', f.content, 'פרטו את נושא הדיון...', true)}
            <div class="form-actions"><button type="button" class="btn btn-ghost" data-act="form-cancel">ביטול</button>
                <button type="button" class="btn btn-primary" id="form-submit" data-act="form-submit">${edit ? 'שמירת שינויים' : 'פרסום הנושא'}</button></div>
        </div>`;
}

function setSubmitBusy(busy) {
    const b = $('#form-submit'), f = state.form;
    if (!b || !f) return;
    b.disabled = busy;
    b.textContent = busy ? 'שומר...' : (f.mode === 'edit' ? 'שמירת שינויים' : 'פרסום הנושא');
}

async function submitTopic() {
    const f = state.form;
    if (!f || state.submitting || !state.user) return;
    const title = f.title.trim(), content = f.content.trim(), tags = f.tags.join(', ');
    if (!title) { toast('יש להזין כותרת', 'error'); $('#form-title').focus(); return; }
    if (!f.category) { toast('יש לבחור קטגוריה', 'error'); return; }
    if (!content) { toast('יש להזין תוכן', 'error'); $('#form-content').focus(); return; }
    if (state.uploads > 0) { toast('ממתינים לסיום העלאת התמונה'); return; }
    state.submitting = true;
    setSubmitBusy(true);
    try {
        if (f.mode === 'edit') {
            const ok = await api.update('id', f.mainId, { title, category: f.category, tags, content });
            if (!ok) throw new Error('update');
            const main = state.posts.find(p => p.id === f.mainId);
            if (main) Object.assign(main, { title, category: f.category, tags, content });
            saveCache();
            state.form = null;
            toast('הנושא עודכן', 'success');
            go('/topic/' + (topicNumber(f.topicId) || encodeURIComponent(f.topicId)));
        } else {
            const now = Date.now();
            const post = {
                id: 'post_' + now, topic_id: 'topic_' + now, title, category: f.category, tags,
                author_name: state.user.name, author_email: state.user.email, author_avatar: state.user.picture,
                content, created_at: new Date().toLocaleString('he-IL'), views: 0, likes: 0, dislikes: 0
            };
            const ok = await api.insert([post]);
            if (!ok) throw new Error('insert');
            state.posts.push(post);
            saveCache();
            afterNewTopic(post);
            try { localStorage.removeItem(CFG.DRAFT_KEY); } catch (e) {}
            state.form = null;
            toast('הנושא פורסם', 'success');
            go('/topic/' + (topicNumber(post.topic_id) || encodeURIComponent(post.topic_id)));
        }
    } catch (e) {
        toast('השמירה נכשלה. מה שכתבתם נשמר, אפשר לנסות שוב', 'error');
    }
    state.submitting = false;
    setSubmitBusy(false);
}

document.addEventListener('mousedown', e => { if (e.target.closest('.tb')) e.preventDefault(); });   // שומר על הסמן והטקסט המסומן
document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    switch (b.dataset.act) {
        case 'fmt': fmt(b.dataset.target, b.dataset.fmt); break;

            const ed = b.closest('.editor'), ta = ed.querySelector('textarea'), pv = ed.querySelector('.preview');

            else ta.focus();
            break;
        }
        case 'pick-cat': if (state.form) { state.form.category = b.dataset.id; paintPick(); queueDraft(); } break;
        case 'tag-del': if (state.form) { state.form.tags.splice(num(b.dataset.i), 1); paintTags(); queueDraft(); } break;
        case 'form-submit': submitTopic(); break;
        case 'form-cancel': { const f = state.form; state.form = null; go(f && f.mode === 'edit' ? '/topic/' + (topicNumber(f.topicId) || encodeURIComponent(f.topicId)) : '/'); break; }

});
document.addEventListener('click', e => { if (e.target.id === 'tags-box') $('#tag-input').focus(); });
document.addEventListener('input', e => {
    const f = state.form, id = e.target.id;
    if (id === 'form-title' && f) { f.title = e.target.value; queueDraft(); }
    if (id === 'form-content' && f) { f.content = e.target.value; queueDraft(); }
    if (id === 'tag-input' && /[,،]/.test(e.target.value)) { addTags(e.target.value); e.target.value = ''; }
});
document.addEventListener('focusout', e => { if (e.target.id === 'tag-input' && e.target.value.trim()) { addTags(e.target.value); e.target.value = ''; } });
document.addEventListener('keydown', e => {
    if (e.target.id === 'tag-input') {
        if (e.key === 'Enter') { e.preventDefault(); if (e.target.value.trim()) { addTags(e.target.value); e.target.value = ''; } }
        else if (e.key === 'Backspace' && !e.target.value && state.form && state.form.tags.length) { state.form.tags.pop(); paintTags(); queueDraft(); }
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && e.target.id === 'form-content') { e.preventDefault(); submitTopic(); }
});
$('#img-input').addEventListener('change', e => {
    const id = state.uploadTarget;
    Array.from(e.target.files || []).forEach(f => uploadImage(f, id));
    e.target.value = '';
});
document.addEventListener('paste', e => {
    const ta = e.target;
    if (!ta.matches || !ta.matches('textarea[data-editor-field]')) return;
    const item = Array.from((e.clipboardData || {}).items || []).find(i => i.type.startsWith('image/'));
    if (item) { e.preventDefault(); const f = item.getAsFile(); if (f) uploadImage(f, ta.id); }
});
document.addEventListener('dragover', e => { if (e.target.matches && e.target.matches('textarea[data-editor-field]')) e.preventDefault(); });
document.addEventListener('drop', e => {
    const ta = e.target;
    if (!ta.matches || !ta.matches('textarea[data-editor-field]')) return;

// זהה לפורום הקיים, כדי שקישורי פרופיל ותיוגים ישנים ימשיכו לעבוד
function userIdFromEmail(email) {
    if (!email) return 'unknown';
    let h = 5381;
    for (let i = 0; i < email.length; i++) { h = ((h << 5) + h) + email.charCodeAt(i); h = h & 0xffffffff; }
    return 'u' + Math.abs(h).toString(36);
}
const countLabel = (n, one, many) => n === 1 ? one : `${n} ${many}`;
const userPath = email => '/user/' + userIdFromEmail(email);
function authorLink(p, cls = 'post-author') {
    const name = esc(p.author_name || 'אורח');
    return p.author_email ? `<a class="${cls}" href="${hrefOf(userPath(p.author_email))}" data-link="${userPath(p.author_email)}">${name}</a>` : `<span class="${cls}">${name}</span>`;
}

function getUsers() {
    const map = new Map();
    state.posts.forEach(p => {
        if (!p.author_email || isCatId(p.topic_id)) return;
        let u = map.get(p.author_email);
        if (!u) { u = { uid: userIdFromEmail(p.author_email), email: p.author_email, name: '', avatar: '', count: 0, topics: 0, rep: 0 }; map.set(p.author_email, u); }
        u.name = p.author_name || u.name;          // הפרטים העדכניים ביותר
        u.avatar = p.author_avatar || u.avatar;
        if (!isDeleted(p)) { u.count++; if (p.title) u.topics++; u.rep += num(p.likes); }
    });
    return [...map.values()];
}

function loginPrompt(title, text) {
    return `<div class="card login-card"><h2>${esc(title)}</h2><p>${esc(text)}</p>${loginLink()}</div>`;
}

function formDialog(title, fields, okLabel = 'שמירה', validate = () => '') {
    return new Promise(resolve => {
        const prev = document.activeElement;
        const ov = document.createElement('div');
        ov.className = 'overlay';
        ov.innerHTML = `<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t" style="max-width:440px"><h3 id="dlg-t">${esc(title)}</h3>
            ${fields.map(f => `<label class="flabel" for="dlg-${f.id}" style="margin-top:14px">${esc(f.label)}</label><input id="dlg-${f.id}" class="input" value="${esc(f.value || '')}" placeholder="${esc(f.placeholder || '')}" autocomplete="off">`).join('')}
            <div class="dialog-actions"><button type="button" class="btn btn-ghost btn-sm" data-r="0">ביטול</button><button type="button" class="btn btn-primary btn-sm" data-r="1">${esc(okLabel)}</button></div></div>`;
        const close = v => { document.removeEventListener('keydown', onKey, true); ov.remove(); if (prev && prev.focus) prev.focus(); resolve(v); };
        const submit = () => {
            const vals = {};
            fields.forEach(f => { vals[f.id] = ov.querySelector('#dlg-' + f.id).value.trim(); });
            const err = validate(vals);
            if (err) { toast(err, 'error'); return; }
            close(vals);
        };
        const onKey = e => {
            if (e.key === 'Escape') { e.preventDefault(); close(null); }
            else if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); submit(); }
        };
        ov.addEventListener('click', e => {
            const b = e.target.closest('[data-r]');
            if (b) { if (b.dataset.r === '1') submit(); else close(null); } else if (e.target === ov) close(null);
        });
        document.addEventListener('keydown', onKey, true);
        document.body.appendChild(ov);
        ov.querySelector('input').focus();
    });
}

async function editUser(uid) {

/* ---------- רענון שקט ברקע ---------- */
let refreshing = false;
async function silentRefresh() {
    if (refreshing || syncBusy || document.hidden || state.loading || state.submitting || state.inflight > 0) return;
    refreshing = true; syncBusy = true;
    try { await loadData(); } finally { refreshing = false; syncBusy = false; }
}
setInterval(silentRefresh, 120000);    // רענון מלא רק כרשת ביטחון, השינויים השוטפים מגיעים מהסנכרון החי

/* ============ חיפוש ============ */
// נרמול לחיפוש: אותיות קטנות, בלי ניקוד, בלי גרשיים וגרשיים (כך ש"רמב"ם" ו"רמבם" זהים)
const normQ = s => String(s || '').toLowerCase().replace(/[\u0591-\u05C7]/g, '').replace(/[\u05F3\u05F4"'`]/g, '');
const hayCache = new WeakMap();
function hay(p) {
    const k = (p.title || '') + '\u0001' + (p.tags || '') + '\u0001' + (p.content || '');
    let c = hayCache.get(p);
    if (!c || c.k !== k) { c = { k, title: normQ(p.title), tags: normQ(p.tags), body: normQ(stripMd(p.content, 1e9)) }; hayCache.set(p, c); }
    return c;
}
// הדגשה בטוחה: מפצלים את הטקסט המקורי לפי המונחים ועושים escape לכל חלק בנפרד
function hl(text, terms) {
    text = String(text || '');
    const ts = terms.filter(Boolean).map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    if (!ts.length) return esc(text);
    return text.split(new RegExp('(' + ts.join('|') + ')', 'gi')).map((part, i) => i % 2 ? `<mark>${esc(part)}</mark>` : esc(part)).join('');
}
function snippet(p, terms) {
    const plain = stripMd(p.content, 1e9), low = plain.toLowerCase();
    let idx = -1;
    terms.forEach(x => { const i = low.indexOf(x); if (i >= 0 && (idx < 0 || i < idx)) idx = i; });
    const start = Math.max(0, idx - 45), end = start + 140;
    return (start > 0 ? '…' : '') + plain.slice(start, end) + (end < plain.length ? '…' : '');
}

function runSearch(terms) {
    const visible = new Set(getTopics().map(m => m.topic_id));
    const topics = [], replies = [];
    state.posts.forEach(p => {
        if (!p.topic_id || isCatId(p.topic_id) || !visible.has(p.topic_id)) return;
        if (isDeleted(p) && !canManage(p)) return;
        const h = hay(p), all = h.title + ' ' + h.tags + ' ' + h.body;
        if (!terms.every(x => all.includes(x))) return;
        let score = 0;
        terms.forEach(x => {
            if (h.title.includes(x)) score += 5 + (h.title.startsWith(x) || h.title.includes(' ' + x) ? 3 : 0);
            if (h.tags.includes(x)) score += 3;
            if (h.body.includes(x)) score += 1;
        });
        (p.title ? topics : replies).push({ p, score });
    });
    const order = (a, b) => b.score - a.score || num(String(b.p.id).replace(/\D/g, '')) - num(String(a.p.id).replace(/\D/g, ''));
    topics.sort(order); replies.sort(order);
    const users = state.user ? getUsers().filter(u => terms.every(x => normQ(u.name).includes(x))).sort((a, b) => b.count - a.count) : [];
    const tags = getTagStats().filter(g => terms.every(x => normQ(g.tag).includes(x)));
    return { topics, replies, users, tags };
}

function searchHTML(q) {
    const terms = normQ(q).split(/\s+/).filter(Boolean);
    if (!terms.length) {
        const tags = getTagStats().slice(0, 8);
        return `<div class="sempty"><b>חיפוש בפורום</b>נושאים, הודעות, משתמשים ותגיות</div>` + (tags.length
            ? `<div class="slabel">תגיות פופולריות</div><div class="schips">${tags.map(g => `<a class="sitem tag" style="padding:5px 14px;border-radius:999px" role="option" href="${hrefOf('/tag/' + encodeURIComponent(g.tag))}" data-link="/tag/${encodeURIComponent(g.tag)}">${esc(g.tag)}</a>`).join('')}</div>` : '');
    }
    const r = runSearch(terms);
    if (!r.topics.length && !r.replies.length && !r.users.length && !r.tags.length) {
        return `<div class="sempty"><b>לא נמצאו תוצאות</b>נסו מילים אחרות או פחות מילים.</div>`;
    }
    const tn = new Map(sortedTopicIds().map((id, i) => [id, i + 1]));
    const pn = new Map(sortedPostIds().map((id, i) => [id, i + 1]));
    const mainOf = new Map(getTopics().map(m => [m.topic_id, m]));
    const item = (path, icon, title, sub) => `<a class="sitem" role="option" href="${hrefOf(path)}" data-link="${path}"><span class="sicon"><i class="fa-solid ${icon}"></i></span><span class="sx"><div class="t">${title}</div><div class="s">${sub}</div></span></a>`;
    let out = '';
    if (r.topics.length) {
        out += '<div class="slabel">נושאים</div>' + r.topics.slice(0, 8).map(({ p }) => {
            const inTitle = terms.some(x => hay(p).title.includes(x));
            const sub = inTitle ? `${esc(catName(p.category))} · ${esc(p.author_name || 'אורח')} · ${esc(timeAgo(p.created_at))}` : hl(snippet(p, terms), terms);
            return item('/topic/' + (tn.get(p.topic_id) || encodeURIComponent(p.topic_id)), 'fa-comments', hl(p.title, terms), sub);
        }).join('');
    }
    if (r.replies.length) {
        out += '<div class="slabel">הודעות</div>' + r.replies.slice(0, 6).map(({ p }) => {
            const m = mainOf.get(p.topic_id);
            return item('/post/' + (pn.get(p.id) || encodeURIComponent(p.id)), 'fa-comment-dots', hl(snippet(p, terms), terms), `${esc(p.author_name || 'אורח')} בנושא ${esc(m ? m.title : '')}`);
        }).join('');
    }
    if (r.users.length) out += '<div class="slabel">משתמשים</div>' + r.users.slice(0, 4).map(u => item('/user/' + u.uid, 'fa-user', hl(u.name, terms), countLabel(u.count, 'הודעה אחת', 'הודעות'))).join('');
    if (r.tags.length) out += '<div class="slabel">תגיות</div>' + r.tags.slice(0, 4).map(g => item('/tag/' + encodeURIComponent(g.tag), 'fa-tag', hl(g.tag, terms), countLabel(g.count, 'נושא אחד', 'נושאים'))).join('');
    return out;
}

let searchEl = null, searchPrev = null, searchTimer;
function setActiveResult(i) {
    if (!searchEl) return;
    const items = [...searchEl.querySelectorAll('.sitem')];
    if (!items.length) return;
    const n = (i + items.length) % items.length;
    items.forEach((el, k) => { el.classList.toggle('active', k === n); el.setAttribute('aria-selected', String(k === n)); });
    items[n].scrollIntoView({ block: 'nearest' });
    searchEl.dataset.sel = n;
}
function paintSearch() {
    if (!searchEl) return;
    $('#search-results', searchEl).innerHTML = searchHTML($('#search-input', searchEl).value);
    searchEl.dataset.sel = -1;
    const first = $('.sitem', searchEl);
    if ($('#search-input', searchEl).value.trim() && first) setActiveResult(0);
}
function openSearch() {
    if (searchEl) return;
    if (state.loading && !state.posts.length) { toast('הפורום עדיין נטען'); return; }
    searchPrev = document.activeElement;
    searchEl = document.createElement('div');
    searchEl.className = 'overlay search-ov';
    searchEl.innerHTML = `<div class="spanel" role="dialog" aria-modal="true" aria-label="חיפוש">
        <div class="shead"><i class="fa-solid fa-magnifying-glass"></i><input id="search-input" placeholder="חיפוש בפורום" autocomplete="off" aria-label="חיפוש" role="combobox" aria-controls="search-results" aria-expanded="true"><span class="kbd">Esc</span></div>
        <div class="sbody" id="search-results" role="listbox"></div></div>`;
    searchEl.addEventListener('click', e => {
        if (e.target === searchEl) closeSearch();
        else if (e.target.closest('.sitem')) setTimeout(closeSearch, 0);
    });
    document.body.appendChild(searchEl);
    paintSearch();
    $('#search-input', searchEl).focus();
}
function closeSearch() {
    if (!searchEl) return;
    searchEl.remove(); searchEl = null;
    if (searchPrev && searchPrev.focus && document.contains(searchPrev)) searchPrev.focus();
}

document.addEventListener('click', e => { if (e.target.closest('[data-act="search-open"]')) openSearch(); });
document.addEventListener('input', e => {
    if (e.target.id !== 'search-input') return;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(paintSearch, 120);
});
document.addEventListener('keydown', e => {
    if (searchEl) {
        const sel = num(searchEl.dataset.sel);
        if (e.key === 'Escape') { e.preventDefault(); closeSearch(); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); setActiveResult(sel + 1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); setActiveResult(sel - 1); }
        else if (e.key === 'Enter' && e.target.id === 'search-input') {
            e.preventDefault();
            clearTimeout(searchTimer); paintSearch();   // מוודאים שהתוצאות מעודכנות לטקסט האחרון
            const el = $('.sitem.active', searchEl) || $('.sitem', searchEl);
            if (el) el.click();
        }
        return;
    }
    const typing = e.target.matches && e.target.matches('input, textarea, select, [contenteditable]');
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); }
    else if (e.key === '/' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey && !$('.overlay')) { e.preventDefault(); openSearch(); }
}, true);

function categoryDialog(cat) {
    return new Promise(resolve => {
        const prev = document.activeElement;
        let icon = cat && cat.category ? cat.category : ICONS[0];
        const icons = ICONS.includes(icon) ? ICONS : [icon, ...ICONS];
        const ov = document.createElement('div');
        ov.className = 'overlay';
        ov.innerHTML = `<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t" style="max-width:460px"><h3 id="dlg-t">${cat ? 'עריכת קטגוריה' : 'קטגוריה חדשה'}</h3>
            <label class="flabel" for="cat-name" style="margin-top:14px">שם הקטגוריה</label><input id="cat-name" class="input" maxlength="40" value="${esc(cat ? cat.title : '')}" autocomplete="off">
            <label class="flabel" for="cat-desc">תיאור קצר</label><input id="cat-desc" class="input" maxlength="120" value="${esc(cat ? cat.content : '')}" autocomplete="off">
            <span class="flabel">אייקון</span><div class="icon-grid" role="radiogroup" aria-label="אייקון">${icons.map(i => `<button type="button" class="icon-opt" role="radio" aria-checked="${i === icon}" data-icon="${esc(i)}" aria-label="${esc(i.replace('fa-', ''))}"><i class="fa-solid ${esc(i)}"></i></button>`).join('')}</div>
            <div class="dialog-actions" style="justify-content:space-between">${cat ? '<button type="button" class="btn btn-ghost btn-sm" style="color:var(--danger)" data-r="del">מחיקת הקטגוריה</button>' : '<span></span>'}
                <span style="display:flex;gap:10px"><button type="button" class="btn btn-ghost btn-sm" data-r="0">ביטול</button><button type="button" class="btn btn-primary btn-sm" data-r="1">שמירה</button></span></div></div>`;
        const close = v => { document.removeEventListener('keydown', onKey, true); ov.remove(); if (prev && prev.focus) prev.focus(); resolve(v); };
        const submit = () => {
            const title = $('#cat-name', ov).value.trim();
            if (!title) { toast('יש להזין שם לקטגוריה', 'error'); return; }
            close({ action: 'save', title, content: $('#cat-desc', ov).value.trim(), icon });
        };
        const onKey = e => {
            if (e.key === 'Escape') { e.preventDefault(); close(null); }
            else if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); submit(); }
        };
        ov.addEventListener('click', e => {
            const io = e.target.closest('.icon-opt');
            if (io) { icon = io.dataset.icon; ov.querySelectorAll('.icon-opt').forEach(x => x.setAttribute('aria-checked', String(x === io))); return; }
            const b = e.target.closest('[data-r]');
            if (b) { if (b.dataset.r === '1') submit(); else if (b.dataset.r === 'del') close({ action: 'delete' }); else close(null); }
            else if (e.target === ov) close(null);
        });
        document.addEventListener('keydown', onKey, true);
        document.body.appendChild(ov);
        $('#cat-name', ov).focus();
    });
}

async function editCategory(id) {
    if (!isAdminUser_()) return;
    const cat = id ? getCategories().find(c => c.topic_id === id) : null;
    const r = await categoryDialog(cat);
    if (!r) return;
    if (r.action === 'delete') {
        const yes = await confirmDialog('מחיקת קטגוריה', 'מחיקת הקטגוריה לא תמחק את הנושאים שבתוכה, אבל הם לא ישויכו יותר לקטגוריה. להמשיך?', 'מחיקה');
        if (!yes) return;
        const ok = await api.remove('topic_id', id);
        if (!ok) { toast('המחיקה נכשלה, נסו שוב', 'error'); return; }
        state.posts = state.posts.filter(p => p.topic_id !== id);
        saveCache();
        toast('הקטגוריה נמחקה', 'success');
        if (parseRoute().type === 'category') go('/'); else render({ soft: true });
        return;
    }
    if (cat) {
        const ok = await api.update('topic_id', id, { title: r.title, content: r.content, category: r.icon });
        if (!ok) { toast('העדכון נכשל, נסו שוב', 'error'); return; }
        Object.assign(cat, { title: r.title, content: r.content, category: r.icon });
        toast('הקטגוריה עודכנה', 'success');
    } else {
        const row = categoryRow({ title: r.title, content: r.content, icon: r.icon, i: 0 });
        const ok = await api.insert([row]);
        if (!ok) { toast('יצירת הקטגוריה נכשלה, נסו שוב', 'error'); return; }
        state.posts.push(row);
        toast('הקטגוריה נוצרה', 'success');
    }
    saveCache();
    render({ soft: true });
}

async function createDefaultCategories() {

async function manageAccess(topicId) {

function parseJwt(token) {
    try {
        const b64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        return JSON.parse(new TextDecoder('utf-8').decode(bytes));   // פענוח UTF-8 תקין לשמות בעברית
    } catch (e) { return null; }
}
function onCredential(resp) {
    const d = parseJwt(resp.credential);
    if (!d || !d.email) { toast('ההתחברות נכשלה, נסו שוב', 'error'); return; }
    // אם למשתמש כבר יש היסטוריה בפורום, שומרים את השם והתמונה שנקבעו לו (גם אם מנהל שינה אותם)
    const ex = [...state.posts].reverse().find(p => p.author_email === d.email);
    const prev = safeJSON(localStorage.getItem(CFG.USER_KEY), null);
    const same = prev && prev.email === d.email ? prev : null;
    state.user = {
        name: ex ? (ex.author_name || d.name) : d.name,
        email: d.email,
        picture: ex ? (ex.author_avatar || '') : d.picture,
        isAdmin: d.email === CFG.ADMIN_EMAIL,
        registered: same ? !!same.registered : false
    };
    saveUser();
    const onLogin = parseRoute().type === 'login';
    const conf = ($('#login-confirm') || {}).checked;
    if (onLogin && conf) {
        registerUser().then(ok => { if (ok) go(consumeReturn()); else render(); });

/* ============ הרשמה, מעקב והתראות (API המשתמשים) ============ */
const curPath = () => { let p = location.pathname; if (BASE && p.indexOf(BASE) === 0) p = p.slice(BASE.length); p = p.replace(/^\/index\.html$/i, ''); return (p || '/') + location.search; };
const consumeReturn = () => { const r = state.returnTo || '/'; state.returnTo = null; return r; };
const saveUser = () => { try { localStorage.setItem(CFG.USER_KEY, JSON.stringify(state.user)); } catch (e) {} };
const isConfirmed = v => v === true || (typeof v === 'string' && v.trim().toUpperCase() === 'TRUE');
const loginLink = () => `<a class="btn btn-primary" href="${hrefOf('/login')}" data-link="/login"><i class="fa-brands fa-google"></i>התחברות והרשמה</a>`;

async function usersGet(query) {
    try {
        const res = await request(CFG.USERS_API_URL + '?' + query, {}, 15000);
        if (!res.ok) return { ok: false };
        return { ok: true, data: await res.json() };
    } catch (e) { return { ok: false }; }
}
async function usersPost(body, { retries = 0 } = {}) {
    for (let i = 0; i <= retries; i++) {
        try {
            const res = await request(CFG.USERS_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }, 20000);
            if (res.ok) { const j = await res.json().catch(() => null); if (!(j && j.error)) return true; }
        } catch (e) { /* ננסה שוב */ }
        if (i < retries) await wait(700);
    }
    return false;
}

async function registerUser() {

async function checkRegistration() {

    const r = await usersGet('action=getUser&email=' + encodeURIComponent(u.email));

/* ---------- מעקב ---------- */
async function loadFollows() {
    if (!state.user) return;
    const r = await usersGet('action=getFollows&email=' + encodeURIComponent(state.user.email));
    if (!r.ok) return;
    const f = { topics: new Set(), users: new Set() };
    (Array.isArray(r.data) ? r.data : []).forEach(x => {
        if (x.type === 'topic') f.topics.add(String(x.target_id));
        else if (x.type === 'user') f.users.add(String(x.target_id).toLowerCase());
    });
    state.follows = f;
}
const followingTopic = id => state.follows.topics.has(String(id));
const followingUser = email => state.follows.users.has(String(email).toLowerCase());
async function setFollow(type, target, on) {
    const set = type === 'topic' ? state.follows.topics : state.follows.users;
    const key = type === 'topic' ? String(target) : String(target).toLowerCase();
    if (on) set.add(key); else set.delete(key);
    const ok = await usersPost({ action: on ? 'follow' : 'unfollow', data: { user_email: state.user.email, type, target_id: target } });
    if (!ok) { if (on) set.delete(key); else set.add(key); }
    return ok;
}
function followTopicBtn(main) {
    if (!state.user || isDeleted(main)) return '';

}
function followUserBtn(u) {

}

function paintHeadSoon(on) { const set = state.follows.topics; const id = state.topicId; if (on) set.add(String(id)); else set.delete(String(id)); paintHead(); }

}

/* ---------- התראות ---------- */
const isUnread = n => String(n.is_read) !== 'TRUE' && String(n.seen_v) !== 'V';
async function loadNotifs() {
    if (!state.user) return;
    const r = await usersGet('action=getNotifications&email=' + encodeURIComponent(state.user.email));
    if (!r.ok || !state.user) return;
    const fresh = Array.isArray(r.data) ? r.data : [];
    // תשובת שרת ישנה לא מחזירה התראה שכבר סומנה כנקראה אצלנו
    fresh.forEach(n => { if (state.locallyRead.has(String(n.id))) n.is_read = 'TRUE'; if (state.locallySeen.has(String(n.id))) n.seen_v = 'V'; });
    state.notifs = fresh;
    paintNotifs();
}
const loadSocial = () => Promise.all([loadFollows(), loadNotifs()]);
function startPolling() {
    if (state.notifTimer) return;
    state.notifTimer = setInterval(() => { if (state.user && state.user.registered && !document.hidden) loadNotifs(); }, 6000);
}
function resetSocial() {

}
const BASE_TITLE = 'פורום בחירות';
function paintNotifs() {

}
function closeNotif() { const p = $('#notif-panel'); if (p) { p.classList.remove('open'); const b = $('#bell-btn'); if (b) b.setAttribute('aria-expanded', 'false'); } }
function openNotif(id) {
    const n = state.notifs.find(x => String(x.id) === String(id));
    if (!n) return;
    if (isUnread(n)) { n.is_read = 'TRUE'; state.locallyRead.add(String(n.id)); paintNotifs(); usersPost({ action: 'markRead', data: { id: n.id } }); }

    if (n.post_id) go('/post/' + encodeURIComponent(n.post_id));
    else if (n.topic_id) go('/topic/' + (topicNumber(n.topic_id) || encodeURIComponent(n.topic_id)));
}
function readAllNotifs() {
    if (!state.user || !state.notifs.length) return;
    state.notifs.forEach(n => { n.is_read = 'TRUE'; state.locallyRead.add(String(n.id)); });
    paintNotifs();
    usersPost({ action: 'markRead', data: { user_email: state.user.email } });
}
// צפייה בנושא מסמנת את ההתראות שלו כנקראו, גם בלי ללחוץ על הפעמון
function markTopicSeen(topicId) {
    if (!state.user || !topicId) return;
    let changed = false;
    state.notifs.forEach(n => { if (String(n.topic_id) === String(topicId) && isUnread(n)) { n.seen_v = 'V'; state.locallySeen.add(String(n.id)); changed = true; } });
    if (!changed) return;
    paintNotifs();
    usersPost({ action: 'markSeen', data: { user_email: state.user.email, topic_id: topicId } });
}

/* ---------- שליחת התראות ---------- */
const mentionedUids = content => { const out = new Set(); String(content || '').replace(/@\[[^\]]+\]\(([^()\s]+)\)/g, (m, uid) => out.add(uid)); return [...out]; };
function mkNotif(email, type, topicId, postId, message) {
    return { user_email: email, type, topic_id: topicId || '', post_id: postId || '', actor_name: state.user.name, actor_email: state.user.email, message };
}
async function notifyFollowers(kind, target, message, type, topicId, postId) {
    if (!state.user) return;
    const r = await usersGet(`action=getFollowers&type=${kind}&target_id=${encodeURIComponent(target)}`);
    if (!r.ok) return;
    const targets = (Array.isArray(r.data) ? r.data : []).filter(f => !emailEq(f.user_email, state.user.email)).map(f => mkNotif(f.user_email, type, topicId, postId, message));
    if (targets.length) usersPost({ action: 'addNotification', data: targets });
}
function notifyMentioned(content, message, topicId, postId) {
    if (!state.user) return;
    const users = getUsers();
    const targets = mentionedUids(content).map(uid => users.find(u => u.uid === uid)).filter(u => u && !emailEq(u.email, state.user.email)).map(u => mkNotif(u.email, 'mention', topicId, postId, message));
    if (targets.length) usersPost({ action: 'addNotification', data: targets });
}
function afterNewTopic(post) {
    const u = state.user;
    if (!u) return;
    autoFollowTopic(post.topic_id);
    notifyFollowers('user', u.email, `${u.name} פתח/ה נושא חדש: "${post.title}"`, 'new_topic', post.topic_id, '');
    notifyMentioned(post.content, `${u.name} תייג/ה אותך בנושא "${post.title}"`, post.topic_id, post.id);
}
function afterReply(post, main) {
    const u = state.user;
    if (!u) return;
    const title = main ? main.title : '';
    autoFollowTopic(post.topic_id);
    notifyFollowers('topic', post.topic_id, `${u.name} הגיב/ה בנושא "${title}"`, 'reply', post.topic_id, post.id);
    notifyMentioned(post.content, `${u.name} תייג/ה אותך בנושא "${title}"`, post.topic_id, post.id);
}

/* ---------- השלמת אזכור עם @ ---------- */
function closeMention() { if (state.mention) { state.mention.el.remove(); state.mention = null; } }
function paintMention() {
    const m = state.mention;
    if (!m) return;
    m.el.innerHTML = m.items.map((u, i) => `<button type="button" class="${i === m.sel ? 'active' : ''}" data-act="mention-pick" data-i="${i}" role="option">${avatar(u.name, u.avatar, 26)}<span>${esc(u.name)}</span></button>`).join('');
}
function updateMention(ta) {
    if (!state.user) return;
    const before = ta.value.slice(0, ta.selectionStart);
    const mt = before.match(/(?:^|\s)@([^\s@\[\]()]{0,20})$/);
    if (!mt) { closeMention(); return; }
    const q = normQ(mt[1]);
    const items = getUsers().filter(u => !q || normQ(u.name).includes(q)).sort((a, b) => b.count - a.count).slice(0, 6);
    if (!items.length) { closeMention(); return; }
    if (!state.mention || state.mention.ta !== ta) {
        closeMention();
        const el = document.createElement('div');
        el.className = 'mention-pop'; el.setAttribute('role', 'listbox');
        ta.closest('.editor').appendChild(el);
        state.mention = { ta, el, items, sel: 0, start: 0 };
    }
    Object.assign(state.mention, { items, sel: 0, start: before.length - mt[1].length - 1 });
    paintMention();
}
function pickMention(i) {
    const m = state.mention;
    if (!m || !m.items[i]) return;
    const u = m.items[i], ta = m.ta;
    const tag = `@[${String(u.name || 'משתמש').replace(/[\[\]()]/g, '')}](${u.uid}) `;
    ta.setRangeText(tag, m.start, ta.selectionStart, 'end');
    closeMention();
    ta.focus();
    ta.dispatchEvent(new Event('input', { bubbles: true }));
}

/* ---------- אירועים ---------- */
document.addEventListener('mousedown', e => { if (e.target.closest('.mention-pop')) e.preventDefault(); });
document.addEventListener('click', e => {
    if (!e.target.closest('.bell-wrap')) closeNotif();
    const b = e.target.closest('[data-act]');
    if (!b) return;
    switch (b.dataset.act) {
        case 'bell-toggle': { const p = $('#notif-panel'), open = p.classList.toggle('open'); b.setAttribute('aria-expanded', String(open)); closeMenu(); if (open) loadNotifs(); break; }
        case 'notif-open': openNotif(b.dataset.id); break;
        case 'notif-readall': readAllNotifs(); break;
        case 'follow-topic': toggleFollowTopic(b.dataset.id); break;
        case 'follow-user': toggleFollowUser(b.dataset.uid); break;
        case 'mention-pick': pickMention(num(b.dataset.i)); break;
        case 'reg-submit': {
            if (!($('#login-confirm') || {}).checked) { toast('יש לאשר את כללי השימוש', 'error'); break; }
            b.disabled = true;
            registerUser().then(ok => { b.disabled = false; if (ok) go(consumeReturn()); });
            break;
        }
    }
});
document.addEventListener('input', e => {
    if (e.target.matches && e.target.matches('textarea[data-editor-field]')) updateMention(e.target);
});
document.addEventListener('change', e => { if (e.target.id === 'login-confirm') updateLoginButton(); });
document.addEventListener('focusout', e => { if (state.mention && e.target === state.mention.ta) closeMention(); });
document.addEventListener('keydown', e => {
    const m = state.mention;
    if (m) {
        if (e.key === 'ArrowDown') { e.preventDefault(); m.sel = (m.sel + 1) % m.items.length; paintMention(); return; }
        if (e.key === 'ArrowUp') { e.preventDefault(); m.sel = (m.sel - 1 + m.items.length) % m.items.length; paintMention(); return; }
        if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); e.stopPropagation(); pickMention(m.sel); return; }
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeMention(); return; }
    }
    if (e.key === 'Escape') closeNotif();
}, true);

/* ============ הפוסטיה ============ */
const PSTIA_SEEN = 'elections_pstia_seen', PSTIA_OPEN = 'elections_pstia_open';
const feedStamp = p => num(String(p.id).replace(/\D/g, ''));
const isPstiaOpen = () => document.body.classList.contains('pstia-open');
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

function feedItemHTML(p) {
    const id = esc(p.id), mine = canManage(p), vote = votes.get(p.id);
    return `<article class="pitem" id="f-${id}">
        <div class="post-head">${avatar(p.author_name, p.author_avatar, 38)}
            <div>${authorLink(p)}<div class="post-time" title="${esc(p.created_at)}">${esc(timeAgo(p.created_at))}</div></div>
            ${p._status === 'pending' ? '<span class="sending">שולח...</span>' : ''}</div>
        <div class="post-body">${renderContent(p.content)}</div>
        <div class="post-actions">
            <button type="button" class="act ${vote === 'like' ? 'on-like' : ''}" data-act="feed-like" data-id="${id}" aria-pressed="${vote === 'like'}" aria-label="אהבתי"><i class="fa-${vote === 'like' ? 'solid' : 'regular'} fa-thumbs-up"></i>${num(p.likes)}</button>
            <span class="grow"></span>
            ${mine ? `<button type="button" class="act danger" data-act="feed-delete" data-id="${id}"><i class="fa-regular fa-trash-can"></i>מחיקה</button>` : ''}</div></article>`;
}

function paintFeed() {
    const el = $('#pstia-feed'), more = $('#pstia-more');
    if (!el) return;
    const all = state.feed.filter(p => p.id && p.content).sort((a, b) => feedStamp(b) - feedStamp(a));
    const shown = all.slice(0, state.pstiaMax);
    diffChildren(el, shown.map(p => ({ id: 'f-' + p.id, html: feedItemHTML(p) })));
    setHTML(more, !all.length
        ? '<div class="pempty"><b>עדיין אין פוסטים</b>היו הראשונים לפרסם בפוסטיה.</div>'
        : (all.length > shown.length ? `<div class="more"><button type="button" class="btn btn-ghost btn-sm" data-act="pstia-more">הצגת עוד (${all.length - shown.length})</button></div>` : ''));
    updatePstiaBadge();
}

function updatePstiaBadge() {
    const badge = $('#pstia-badge');
    if (!badge) return;
    const latest = state.feed.reduce((m, p) => Math.max(m, feedStamp(p)), 0);
    if (isPstiaOpen() || lsGet(PSTIA_SEEN) === null) { if (state.rev >= 0) lsSet(PSTIA_SEEN, String(latest)); badge.hidden = true; return; }
    const seen = num(lsGet(PSTIA_SEEN)), me = state.user && state.user.email;
    const n = state.feed.filter(p => feedStamp(p) > seen && !emailEq(p.author_email, me)).length;
    badge.hidden = !n; badge.textContent = n > 99 ? '99+' : n;
}

function paintPstiaComposer() {
    const el = $('#pstia-composer');
    if (!el) return;
    const u = state.user, sig = u ? u.email : 'out';
    if (el.dataset.sig === sig && el.firstChild) return;     // לא בונים מחדש, כדי לא לאבד מה שהוקלד
    el.dataset.sig = sig;
    el.innerHTML = u
        ? `<div class="pcomposer">${editorHTML('pstia-input', state.pstiaDraft, 'מה תרצו לשתף?')}<div class="pfoot"><span>Ctrl+Enter לשליחה</span><button type="button" class="btn btn-primary btn-sm" data-act="pstia-send">פרסום</button></div></div>`
        : `<div class="pcomposer"><div class="pnote">כדי לפרסם בפוסטיה צריך <a href="${hrefOf('/login')}" data-link="/login">להתחבר</a>.</div></div>`;
}

function setPstia(open) {
    document.body.classList.toggle('pstia-open', open);
    $('#pstia').classList.toggle('open', open);
    $('#pstia').setAttribute('aria-hidden', String(!open));
    $('#pstia-tab').setAttribute('aria-expanded', String(open));
    lsSet(PSTIA_OPEN, open ? '1' : '');
    if (open) { paintPstiaComposer(); paintFeed(); }
    updatePstiaBadge();
}

async function sendPstia() {
    if (!state.user) { toast('יש להתחבר כדי לפרסם', 'error'); return; }
    const ta = $('#pstia-input'), content = ta ? ta.value.trim() : '';
    if (!content) return;
    if (state.uploads > 0) { toast('ממתינים לסיום העלאת התמונה'); return; }
    const post = { id: 'fp_' + Date.now(), author_name: state.user.name, author_email: state.user.email, author_avatar: state.user.picture,
        content, created_at: new Date().toLocaleString('he-IL'), likes: 0, _status: 'pending' };
    state.feed.push(post);
    state.pstiaDraft = ''; ta.value = '';
    paintFeed();
    $('#pstia-scroll').scrollTo({ top: 0, behavior: 'smooth' });
    const ok = await feedApi.insert([post]);
    if (ok) { post._status = null; paintFeed(); }
    else {
        state.feed = state.feed.filter(x => x !== post);
        state.pstiaDraft = content; const live = $('#pstia-input'); if (live) live.value = content;
        paintFeed(); toast('הפרסום נכשל, הטקסט נשמר בתיבה. נסו שוב', 'error');
    }
}

async function likeFeed(id) {
    if (!state.user) { toast('יש להתחבר כדי להצביע', 'error'); return; }
    const post = state.feed.find(p => p.id === id);
    if (!post) return;
    const cur = votes.get(id), prev = num(post.likes);
    post.likes = Math.max(0, prev + (cur === 'like' ? -1 : 1));
    votes.set(id, cur === 'like' ? null : 'like');
    paintFeed();
    const ok = await feedApi.update(id, { likes: post.likes });
    if (!ok) { post.likes = prev; votes.set(id, cur); paintFeed(); toast('שמירת ההצבעה נכשלה', 'error'); }
}

async function deleteFeed(id) {
    const post = state.feed.find(p => p.id === id);
    if (!post || !canManage(post)) return;
    if (!await confirmDialog('מחיקת פוסט', 'הפוסט יימחק לצמיתות.', 'מחיקה')) return;
    const prev = state.feed.slice();
    state.feed = state.feed.filter(p => p.id !== id);
    paintFeed();
    const ok = await feedApi.remove(id);
    if (ok) toast('הפוסט נמחק', 'success');
    else { state.feed = prev; paintFeed(); toast('המחיקה נכשלה, נסו שוב', 'error'); }
}

document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    switch (b.dataset.act) {
        case 'pstia-toggle': setPstia(!isPstiaOpen()); break;
        case 'pstia-close': setPstia(false); break;
        case 'pstia-send': sendPstia(); break;
        case 'pstia-more': state.pstiaMax += 40; paintFeed(); break;
        case 'feed-like': likeFeed(b.dataset.id); break;
        case 'feed-delete': deleteFeed(b.dataset.id); break;
    }
});
document.addEventListener('input', e => { if (e.target.id === 'pstia-input') state.pstiaDraft = e.target.value; });
document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && e.target.id === 'pstia-input') { e.preventDefault(); sendPstia(); }
    else if (e.key === 'Escape' && isPstiaOpen() && !$('.overlay') && !state.mention) setPstia(false);
});

/* ============ אתחול ============ */
state.user = safeJSON(localStorage.getItem(CFG.USER_KEY), null);
document.addEventListener('visibilitychange', () => {
    if (!document.hidden) syncOnce();
});
render();
loadData();
initGoogle();
if (window.innerWidth > 760 && lsGet(PSTIA_OPEN) === '1') setPstia(true);
if (state.user) checkRegistration();
</script>
</body>
</html>
